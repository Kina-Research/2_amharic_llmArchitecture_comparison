[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amharic-llm-comparison"
version = "0.1.0"
description = "Encoder-only vs encoder-decoder vs decoder-only LLMs on Amharic sentiment classification and abstractive summarization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
# Exact pins live in requirements.txt (single source of truth).
dependencies = []

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
